<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.14/purify.min.js" integrity="sha384-46dPGH1XlTmj7bc50bqLjTdORXs/3EP2QpA/6EWbelYWOY9VGp+87RT61S3Mcslb" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']], packages: {'[+]': ['ams']}, tags: 'ams' },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] },
  startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.16.1/mermaid.min.js" integrity="sha384-aBQXj4hK6Jm05i7aQAsUV3bLdSUrHX1BGYfMB0166TtWt/RRaw+h0Eelme9OCOvy" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#fbfaf7; --panel:#f3f1ec; --text:#1f2328; --muted:#6b6f76; --line:#e2dfd8;
  --accent:#2457c5; --code-bg:#f2f0ea; --quote:#8a6d3b; --mark:#fff1a8;
  --serif:'Source Serif 4',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --fs:18px;
}
[data-theme=dark]{
  --bg:#16181c; --panel:#1d2025; --text:#e3e5e8; --muted:#9097a1; --line:#2d3139;
  --accent:#7aa7ff; --code-bg:#1f2329; --quote:#d6b46a; --mark:#5c4d12;
}
[data-theme=sepia]{
  --bg:#f4ecd8; --panel:#ebe1c8; --text:#3b2f22; --muted:#7a6a55; --line:#d9cbab;
  --accent:#8a4b16; --code-bg:#ece2c9; --quote:#7a5a2a; --mark:#f3d98a;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scrollbar-gutter:stable;overflow-x:clip;overscroll-behavior-y:none}
body{overflow-x:clip;min-height:100vh}
*{overflow-anchor:none}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--text);font-family:var(--sans);transition:background .2s,color .2s}

/* top bar */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-size:13px}
.bar .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.bar .sp{flex:1}
.btn{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.icon{padding:5px 9px}
a.btn{text-decoration:none;display:inline-block;line-height:1.35}
select.btn{padding:4px 6px}
#progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;will-change:transform}

/* layout */
.wrap{display:flex;align-items:flex-start}
#toc{position:sticky;top:46px;align-self:flex-start;width:260px;flex:none;max-height:calc(100vh - 46px);overflow:auto;padding:22px 14px 40px 18px;
  font-size:13px;border-right:1px solid var(--line)}
#toc.hidden{display:none}
#toc .t{font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-bottom:10px}
#toc a{display:block;color:var(--muted);text-decoration:none;padding:3px 6px;border-radius:5px;line-height:1.35}
#toc a:hover{color:var(--text);background:var(--panel)}
#toc a.on{color:var(--accent);background:var(--panel)}
#toc .tabs{display:flex;gap:2px;margin:-6px 0 14px;border-bottom:1px solid var(--line)}
#toc .tabs button{flex:1;font:500 12px var(--sans);color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:6px 2px;cursor:pointer}
#toc .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
#toc .dir{font-size:11.5px;color:var(--muted);margin:0 0 8px 6px;word-break:break-all}
#toc a.cur{color:var(--text);font-weight:600;background:var(--panel)}
#toc a small{display:block;font-size:11px;color:var(--muted);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toc .empty{color:var(--muted);font-style:italic;padding:4px 6px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px 8px 14px;font:13px var(--sans);box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;z-index:50;transition:opacity .4s}
#toast[hidden]{display:none}
#live{font:600 11.5px var(--sans);color:#2da44e;letter-spacing:.02em;white-space:nowrap;transition:color .3s}
#live.flash{color:var(--accent)}
#find{position:absolute;right:14px;top:calc(100% + 8px);display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:6px 8px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#findQ{font:14px var(--sans);width:220px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;outline:none}
#findQ:focus{border-color:var(--accent)}
#findN{font:12px var(--sans);color:var(--muted);min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
#doc mark.hit{background:#ffe066;color:#111;border-radius:2px;padding:0;box-shadow:0 0 0 1px #ffe066}
#doc mark.hit.cur{background:#ff9632;box-shadow:0 0 0 2px #ff9632}
#toc .l2{padding-left:16px}#toc .l3{padding-left:28px;font-size:12.5px}#toc .l4{padding-left:40px;font-size:12px}
main{flex:1;min-width:0;padding:40px 24px 120px}

/* drop zone */
#drop{max-width:620px;margin:10vh auto;border:2px dashed var(--line);border-radius:16px;padding:48px 28px;text-align:center;color:var(--muted)}
#drop h1{font-family:var(--serif);color:var(--text);font-weight:600;margin:0 0 10px;font-size:30px}
#drop.over{border-color:var(--accent);background:var(--panel)}
#drop .row{display:flex;gap:10px;justify-content:center;margin:22px 0 10px;flex-wrap:wrap}
#paste{width:100%;min-height:120px;margin-top:14px;font:13px var(--mono);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
body.dragging::after{content:"Drop .md file";position:fixed;inset:0;display:grid;place-items:center;font:600 28px var(--sans);
  color:var(--accent);background:color-mix(in srgb,var(--bg) 85%,transparent);border:3px dashed var(--accent);z-index:99}

/* ---------- article typography ---------- */
#doc{max-width:760px;margin:0 auto;font-family:var(--serif);font-size:var(--fs);line-height:1.7;
  font-variant-numeric:oldstyle-nums;hyphens:auto;overflow-wrap:break-word}
#doc.sansf{font-family:var(--sans);font-size:calc(var(--fs) - 1px)}
#doc.wide{max-width:1000px}
#doc > :first-child{margin-top:0}
#doc h1,#doc h2,#doc h3,#doc h4,#doc h5,#doc h6{font-family:var(--serif);font-weight:700;line-height:1.25;margin:1.9em 0 .6em;scroll-margin-top:64px;font-variant-numeric:lining-nums}
#doc h1{font-size:2.1em;letter-spacing:-.01em;margin-top:.4em}
#doc h2{font-size:1.55em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
#doc h3{font-size:1.25em}
#doc h4{font-size:1.06em}
#doc h5,#doc h6{font-size:.95em;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
#doc .anchor{opacity:0;margin-left:.3em;color:var(--muted);text-decoration:none;font-weight:400}
#doc :is(h1,h2,h3,h4):hover .anchor{opacity:1}
#doc p{margin:0 0 1.05em}
#doc a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
#doc strong{font-weight:700}
#doc mark{background:var(--mark);color:inherit;padding:0 .15em;border-radius:3px}
#doc ul,#doc ol{padding-left:1.6em;margin:0 0 1.05em}
#doc li{margin:.25em 0}
#doc li > p{margin:.3em 0}
#doc li::marker{color:var(--muted)}
#doc ul.contains-task-list,#doc li.task-list-item{list-style:none}
#doc li.task-list-item{margin-left:-1.3em}
#doc li.task-list-item input{margin-right:.5em;transform:translateY(1px);accent-color:var(--accent)}
#doc blockquote{margin:1.2em 0;padding:.2em 1.1em;border-left:3px solid var(--quote);color:var(--muted);font-style:italic}
#doc blockquote p:last-child{margin-bottom:.3em}
#doc hr{border:0;height:1px;background:var(--line);margin:2.4em 0}
#doc img{max-width:100%;height:auto;border-radius:6px;display:block;margin:1em auto}
#doc code{font-family:var(--mono);font-size:.84em;background:var(--code-bg);padding:.12em .38em;border-radius:5px;font-variant-numeric:normal}
#doc pre{position:relative;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;margin:1.2em 0;line-height:1.55}
#doc pre code{background:none;padding:0;font-size:.8em;white-space:pre}
#doc pre .lang{position:absolute;top:6px;right:10px;font:500 10.5px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
#doc pre .copy{position:absolute;top:4px;right:8px;opacity:0;font:12px var(--sans)}
#doc pre:hover .copy{opacity:1}#doc pre:hover .lang{opacity:0}
#doc .tablewrap{overflow-x:auto;margin:1.3em 0}
#doc table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:.86em;font-variant-numeric:tabular-nums lining-nums}
#doc th,#doc td{border:1px solid var(--line);padding:.5em .75em;text-align:left;vertical-align:top}
#doc th{background:var(--panel);font-weight:600}
#doc tr:nth-child(even) td{background:color-mix(in srgb,var(--panel) 45%,transparent)}
#doc details{border:1px solid var(--line);border-radius:8px;padding:.5em 1em;margin:1em 0}
#doc summary{cursor:pointer;font-weight:600}
#doc kbd{font:.8em var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:.05em .35em;background:var(--panel)}
#doc .footnotes{font-size:.88em;color:var(--muted);border-top:1px solid var(--line);margin-top:3em;padding-top:1em}
#doc mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;margin:1.1em 0 !important;padding:.2em 0}
#doc mjx-container{font-variant-numeric:normal}
#doc .mermaid{display:flex;justify-content:center;margin:1.4em 0}
/* GitHub-style callouts */
#doc .callout{border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 9%,transparent);border-radius:0 8px 8px 0;padding:.6em 1em;margin:1.2em 0;font-style:normal;color:var(--text)}
#doc .callout .ct{font:600 .82em var(--sans);color:var(--c);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25em}
#doc .callout p:last-child{margin-bottom:0}

/* highlight.js theme (inline) */
.hljs-comment,.hljs-quote{color:#8b949e;font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-type{color:#b0306b}
.hljs-string,.hljs-regexp,.hljs-addition{color:#22863a}
.hljs-number,.hljs-symbol,.hljs-bullet{color:#a65e00}
.hljs-title,.hljs-section,.hljs-function .hljs-title{color:#5a3fc4}
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable,.hljs-built_in{color:#0b6db0}
.hljs-meta{color:#6b7280}.hljs-deletion{color:#c62828}
[data-theme=dark] .hljs-keyword,[data-theme=dark] .hljs-selector-tag,[data-theme=dark] .hljs-literal,[data-theme=dark] .hljs-type{color:#ff7ab6}
[data-theme=dark] .hljs-string,[data-theme=dark] .hljs-regexp{color:#8fdc8f}
[data-theme=dark] .hljs-number{color:#f2b36b}
[data-theme=dark] .hljs-title,[data-theme=dark] .hljs-section{color:#c3a6ff}
[data-theme=dark] .hljs-attr,[data-theme=dark] .hljs-built_in,[data-theme=dark] .hljs-variable{color:#79c0ff}

/* editor */
#editPane{display:none}
body.editing #editPane{display:block;position:sticky;top:46px;align-self:flex-start;width:50%;flex:none;height:calc(100vh - 46px);border-right:1px solid var(--line)}
#ed{display:block;width:100%;height:100%;border:0;resize:none;margin:0;padding:22px 20px 40vh;font:14px/1.65 var(--mono);background:var(--panel);color:var(--text);outline:none;tab-size:4}
body.editing #toc{display:none}
body.editing main{padding:28px 22px 120px}
body.editing .ro{display:none}
.eo{display:none}
body.editing .eo{display:inline-block}
#edState{font:12px var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
#edState[data-k=dirty]{color:#bf8700}#edState[data-k=ok]{color:#2da44e}#edState[data-k=err]{color:#cf222e;font-weight:600}
body.editing #pvBtn{display:none}
@media (max-width:900px){#toc{display:none}main{padding:24px 16px 100px}
  body.editing #editPane{width:100%}body.editing main{display:none}body.editing #pvBtn{display:inline-block}
  body.editing.pv #editPane{display:none}body.editing.pv main{display:block}}
@media print{.bar,#toc{display:none}main{padding:0}#doc{max-width:none}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn icon" id="tocBtn" title="Contents">☰</button>
  <span class="name" id="fname">Markdown Reader</span>
  <span id="live" hidden title="Live: updates when the file is saved">● Live</span>
  <span class="sp"></span>
  <a class="btn icon" id="revealBtn" hidden title="Show in folder">📂</a>
  <span id="edState" class="eo"></span>
  <button class="btn eo" id="pvBtn" title="Switch between text and preview">Preview</button>
  <button class="btn eo" id="saveBtn" title="Save (Ctrl+S)">Save</button>
  <button class="btn eo" id="doneBtn" title="Back to reading">Done</button>
  <button class="btn ro" id="editBtn" hidden title="Edit this file (E)">✎ Edit</button>
  <button class="btn icon ro" id="findBtn" title="Search (Ctrl+F or /)">🔍</button>
  <button class="btn ro" id="openBtn">Open .md</button>
  <select class="btn ro" id="font" title="Typeface"><option value="serif">Serif</option><option value="sans">Sans</option></select>
  <button class="btn icon ro" id="smaller" title="Smaller text">A−</button>
  <button class="btn icon ro" id="bigger" title="Larger text">A+</button>
  <button class="btn icon ro" id="width" title="Toggle wide layout">↔</button>
  <select class="btn" id="theme" title="Theme"><option value="light">Light</option><option value="sepia">Sepia</option><option value="dark">Dark</option></select>
  <input type="file" id="file" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden>
  <div id="progress"></div>
  <div id="find" hidden>
    <input id="findQ" type="search" placeholder="Search in document…" autocomplete="off" spellcheck="false">
    <span id="findN"></span>
    <button class="btn icon" id="findPrev" title="Previous (Shift+Enter)">↑</button>
    <button class="btn icon" id="findNext" title="Next (Enter)">↓</button>
    <button class="btn icon" id="findX" title="Close (Esc)">✕</button>
  </div>
</div>

<div class="wrap">
  <nav id="toc" class="hidden">
    <div class="tabs" id="tabs" hidden><button data-p="toc" class="on">Contents</button><button data-p="folder">Folder</button><button data-p="recent">Recent</button></div>
    <div id="pane-toc" class="pane"></div>
    <div id="pane-folder" class="pane" hidden></div>
    <div id="pane-recent" class="pane" hidden></div>
  </nav>
  <div id="editPane"><textarea id="ed" spellcheck="true" autocomplete="off" aria-label="Markdown text"></textarea></div>
  <main>
    <div id="drop">
      <h1>Markdown Reader</h1>
      <div>Open or drop a <b>.md</b> file. Supports GFM tables, task lists, footnotes-style links, code highlighting, LaTeX math (<code>$…$</code>, <code>$$…$$</code>, <code>\(…\)</code>, <code>\[…\]</code>), Mermaid diagrams and GitHub callouts.</div>
      <div class="row">
        <button class="btn" id="openBtn2">Choose file…</button>
        <button class="btn" id="demoBtn">Show sample</button>
      </div>
      <textarea id="paste" placeholder="…or paste Markdown here and press Ctrl/⌘ + Enter"></textarea>
    </div>
    <article id="doc" hidden></article>
    <div id="toast" hidden><span>Resumed where you left off</span><button class="btn" id="toTop">Start from top</button></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const store = { get(k,d){try{return localStorage.getItem(k)??d}catch{return d}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };

/* ---------- preferences ---------- */
let fs = +store.get('mdr-fs', 18);
const applyPrefs = () => {
  document.documentElement.style.setProperty('--fs', fs + 'px');
  document.documentElement.dataset.theme = $('#theme').value;
  $('#doc').classList.toggle('sansf', $('#font').value === 'sans');
  $('#doc').classList.toggle('wide', store.get('mdr-wide','0') === '1');
};
$('#theme').value = store.get('mdr-theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
$('#font').value = store.get('mdr-font', 'serif');
applyPrefs();
$('#theme').onchange = () => { store.set('mdr-theme', $('#theme').value); applyPrefs(); rerunMermaid(); };
$('#font').onchange = () => { store.set('mdr-font', $('#font').value); applyPrefs(); };
$('#smaller').onclick = () => { fs = Math.max(13, fs - 1); store.set('mdr-fs', fs); applyPrefs(); };
$('#bigger').onclick = () => { fs = Math.min(28, fs + 1); store.set('mdr-fs', fs); applyPrefs(); };
$('#width').onclick = () => { store.set('mdr-wide', store.get('mdr-wide','0') === '1' ? '0' : '1'); applyPrefs(); };
$('#tocBtn').onclick = () => $('#toc').classList.toggle('hidden');

/* ---------- file input ---------- */
const openFile = () => $('#file').click();
$('#openBtn').onclick = openFile; $('#openBtn2').onclick = openFile;
$('#file').onchange = e => { const f = e.target.files[0]; if (f) readFile(f); e.target.value = ''; };
function readFile(f){ const r = new FileReader(); r.onload = () => render(r.result, f.name); r.readAsText(f); }
let depth = 0;
addEventListener('dragenter', e => { e.preventDefault(); depth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); depth = 0; document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0]; if (f) readFile(f); });
$('#paste').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && e.target.value.trim()) render(e.target.value, 'Pasted text'); });

/* ---------- math protection ---------- */
// Pull math out before Markdown parsing so _ * \ inside formulas survive; skip code spans/blocks.
function protectMath(src){
  const store = [];
  const keep = (tex, display) => { store.push({tex, display}); return `\uE000M${store.length - 1}\uE001`; };
  // split out fenced code and inline code so they are untouched
  const parts = src.split(/(```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]+`)/g);
  for (let i = 0; i < parts.length; i += 2) {
    parts[i] = parts[i]
      .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keep(t, true))
      .replace(/\\\[([\s\S]+?)\\\]/g, (_, t) => keep(t, true))
      .replace(/\\begin\{(equation|align|gather|multline|eqnarray)(\*?)\}[\s\S]+?\\end\{\1\2\}/g, m => keep(m, true))
      .replace(/\\\(([\s\S]+?)\\\)/g, (_, t) => keep(t, false))
      .replace(/(^|[^\\$])\$(?!\s)((?:\\\$|[^$\n])+?)(?<!\s)\$(?!\d)/g, (_, pre, t) => pre + keep(t, false));
  }
  return { text: parts.join(''), store };
}
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function restoreMath(html, store){
  return html.replace(/\uE000M(\d+)\uE001/g, (_, i) => {
    const m = store[+i];
    if (/^\\begin/.test(m.tex)) return `<div class="mathd">${esc(m.tex)}</div>`;
    return m.display ? `<div class="mathd">\\[${esc(m.tex)}\\]</div>` : `\\(${esc(m.tex)}\\)`;
  });
}

/* ---------- marked setup ---------- */
const slugCount = {};
const mermaidSrc = [];   // diagram sources stay in JS: the sanitizer removes attributes that contain "-->"
const slug = t => { let s = t.toLowerCase().replace(/<[^>]+>/g,'').replace(/[^\wÀ-￿\- ]+/g,'').trim().replace(/\s+/g,'-') || 'section';
  if (slugCount[s] != null) s += '-' + (++slugCount[s]); else slugCount[s] = 0; return s; };
marked.use({
  gfm: true, breaks: false,
  renderer: {
    code(code, lang){
      const l = (lang || '').trim().split(/\s+/)[0].toLowerCase();
      if (l === 'mermaid') { mermaidSrc.push(code); return `<div class="mermaid" data-i="${mermaidSrc.length - 1}">${esc(code)}</div>`; }
      let out;
      try { out = l && hljs.getLanguage(l) ? hljs.highlight(code, {language: l}).value : hljs.highlightAuto(code).value; }
      catch { out = esc(code); }
      return `<pre>${l ? `<span class="lang">${esc(l)}</span>` : ''}<button class="btn copy">Copy</button><code class="hljs">${out}</code></pre>`;
    },
    table(header, body){ return `<div class="tablewrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`; },
    blockquote(quote){
      const m = quote.match(/^\s*<p>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(<br>)?\n?/i);
      if (m) {
        const k = m[1].toUpperCase();
        const col = {NOTE:'#2f81f7',TIP:'#2da44e',IMPORTANT:'#8250df',WARNING:'#bf8700',CAUTION:'#cf222e'}[k];
        return `<blockquote class="callout" style="--c:${col}"><div class="ct">${k}</div><p>${quote.slice(m[0].length)}</blockquote>`;
      }
      return `<blockquote>${quote}</blockquote>`;
    }
  }
});

/* ---------- render ---------- */
let renderBusy = false, renderNext = null;
async function render(src, name, opts = {}){
  if (renderBusy) { renderNext = [src, name, opts]; return; }
  renderBusy = true;
  try { await renderNow(src, name, opts); } finally { renderBusy = false; }
  if (renderNext) { const n = renderNext; renderNext = null; render(...n); }
}
async function renderNow(src, name, opts){
  const live = !!opts.live, keepY = document.documentElement.scrollTop;
  for (const k in slugCount) delete slugCount[k];
  mermaidSrc.length = 0;
  src = src.replace(/^﻿/, '').replace(/^---\n[\s\S]*?\n---\n/, ''); // strip BOM + YAML front-matter
  const { text, store: mstore } = protectMath(src);
  let html = marked.parse(text);
  html = restoreMath(html, mstore);
  html = html.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
  html = DOMPurify.sanitize(html, { ADD_ATTR: ['data-i','style'], ADD_TAGS: ['details','summary'] });

  const doc = $('#doc');
  doc.innerHTML = html;
  if (live) scrollTo(0, keepY);
  doc.hidden = false; $('#drop').hidden = true;
  $('#fname').textContent = name; document.title = name.replace(/\.(md|markdown)$/i,'') + ' — Markdown Reader';

  // links open outside; headings get ids/anchors
  doc.querySelectorAll('a[href]').forEach(a => { if (!a.getAttribute('href').startsWith('#')) { a.target = '_blank'; a.rel = 'noopener'; } });
  const heads = [...doc.querySelectorAll('h1,h2,h3,h4')];
  heads.forEach(h => { h.id = slug(h.textContent); const a = document.createElement('a'); a.className='anchor'; a.href='#'+h.id; a.textContent='#'; h.append(a); });
  doc.querySelectorAll('pre .copy').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.parentElement.querySelector('code').innerText); b.textContent='Copied'; }
    catch { b.textContent='Select & copy'; }
    setTimeout(() => b.textContent='Copy', 1400);
  });

  posKey = 'mdr-pos:' + (M && M.path ? M.path : name);
  restoring = true;
  buildToc(heads);
  if (!live) scrollTo(0, 0); else scrollTo(0, keepY);
  try { MathJax.typesetClear([doc]); await MathJax.typesetPromise([doc]); } catch (e) { console.warn(e); }
  await rerunMermaid();
  restoring = false;
  if (live) { scrollTo(0, keepY); if (!$('#find').hidden && $('#findQ').value) runFind($('#findQ').value, true); }
  else restorePos();
}

const M = window.__MD || null;
function buildToc(heads){
  const toc = $('#toc'), min = heads.length ? Math.min(...heads.map(h => +h.tagName[1])) : 1;
  $('#pane-toc').innerHTML = heads.length
    ? heads.map(h => `<a href="#${h.id}" class="l${+h.tagName[1] - min + 1}">${esc(h.textContent.replace(/#$/,''))}</a>`).join('')
    : '<div class="empty">No headings</div>';
  const hasFolder = M && M.folder && M.folder.length > 1, hasRecent = M && M.recent && M.recent.length > 1;
  if (M) {
    $('#pane-folder').innerHTML = `<div class="dir">${esc(M.root || M.dir)}</div>` + (M.folder || []).map(f => {
      const i = f.name.lastIndexOf('/');
      const label = i < 0 ? esc(f.name) : `${esc(f.name.slice(i + 1))}<small>${esc(f.name.slice(0, i))}/</small>`;
      return `<a href="${f.view}" class="${f.path === M.path ? 'cur' : ''}">${label}</a>`;
    }).join('') || '<div class="empty">No other files</div>';
    $('#pane-recent').innerHTML = (M.recent || []).map(f =>
      `<a href="${f.view}" class="${f.path === M.path ? 'cur' : ''}">${esc(f.name)}<small>${esc(f.dir)}</small></a>`).join('') || '<div class="empty">Nothing yet</div>';
  }
  $('#tabs').hidden = !M;
  toc.classList.toggle('hidden', heads.length < 2 && !M);
  showPane(store.get('mdr-pane', 'toc'));
}
function showPane(p){
  if ($('#tabs').hidden) p = 'toc';
  ['toc','folder','recent'].forEach(x => { $('#pane-' + x).hidden = x !== p; });
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  const cur = $('#pane-' + p + ' a.cur'); if (cur) cur.scrollIntoView({block:'nearest'});
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; store.set('mdr-pane', b.dataset.p); showPane(b.dataset.p); });

/* reading position: remembered per file */
let posKey = null, restoring = false;
function savePos(){
  if (!posKey || restoring || editing) return;
  const h = document.documentElement, max = h.scrollHeight - h.clientHeight;
  store.set(posKey, JSON.stringify({ f: max > 0 ? h.scrollTop / max : 0, t: Date.now() }));
}
function restorePos(){
  if (location.hash) return;
  let v; try { v = JSON.parse(store.get(posKey, 'null')); } catch { v = null; }
  if (!v || !(v.f > 0.01)) return;
  const h = document.documentElement;
  restoring = true; scrollTo(0, v.f * (h.scrollHeight - h.clientHeight)); setTimeout(() => restoring = false, 300);
  const t = $('#toast'); t.hidden = false; t.style.opacity = 1;
  clearTimeout(restorePos.tm); restorePos.tm = setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.hidden = true, 400); }, 5000);
}
$('#toTop').onclick = () => { scrollTo({top:0, behavior:'smooth'}); $('#toast').hidden = true; };
addEventListener('pagehide', savePos);

let mermaidN = 0;
async function rerunMermaid(){
  const nodes = [...document.querySelectorAll('#doc .mermaid')];
  if (!nodes.length || !window.mermaid) return;
  mermaid.initialize({ startOnLoad:false, securityLevel:'strict', theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'neutral' });
  for (const n of nodes) {
    if (!n.dataset.src) n.dataset.src = mermaidSrc[+n.dataset.i] ?? n.textContent;   // kept for theme changes
    const src = n.dataset.src;
    try { const { svg } = await mermaid.render('mmd' + (mermaidN++), src); n.innerHTML = svg; }
    catch { n.innerHTML = `<pre><code>${esc(src)}</code></pre>`; }
  }
}

/* ---------- scroll progress + active TOC ---------- */
let ticking = false, lastOn = null;
addEventListener('scroll', () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    clearTimeout(savePos.tm); savePos.tm = setTimeout(savePos, 400);
    const h = document.documentElement; const p = Math.min(1, h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight));
    $('#progress').style.transform = `scaleX(${p})`;
    const heads = document.querySelectorAll('#doc :is(h1,h2,h3,h4)');
    let cur = heads[0]; for (const x of heads) { if (x.getBoundingClientRect().top < 90) cur = x; else break; }
    const id = cur ? cur.id : null;
    if (id === lastOn) return; lastOn = id;
    document.querySelectorAll('#pane-toc a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + id));
  });
}, { passive: true });

/* ---------- sample ---------- */
const SAMPLE = `# Projectile Motion — Notes

A body thrown with speed $u$ at angle $\\theta$ to the horizontal follows a **parabola**. Here is a short summary.

## Key results

$$
R = \\frac{u^2 \\sin 2\\theta}{g}, \\qquad H = \\frac{u^2 \\sin^2\\theta}{2g}, \\qquad T = \\frac{2u\\sin\\theta}{g}
$$

Range is maximum at $\\theta = 45^\\circ$, giving $R_{\\max} = u^2/g$.

> [!TIP]
> Complementary angles ($\\theta$ and $90^\\circ - \\theta$) give the **same range**.

### Equation of trajectory

\\begin{align}
y &= x\\tan\\theta - \\frac{g x^2}{2u^2\\cos^2\\theta} \\\\
  &= x\\tan\\theta\\left(1 - \\frac{x}{R}\\right)
\\end{align}

## Quick table

| Angle | Range (u = 20 m/s) | Max height |
|------:|-------------------:|-----------:|
| 30°   | 35.3 m             | 5.1 m      |
| 45°   | 40.8 m             | 10.2 m     |
| 60°   | 35.3 m             | 15.3 m     |

## Checklist

- [x] Resolve velocity into components
- [x] Write equations separately for x and y
- [ ] Eliminate $t$ to get the path

## Code

\`\`\`python
import math
def rng(u, th, g=9.8):
    return u**2 * math.sin(2*math.radians(th)) / g
print(rng(20, 45))   # 40.8
\`\`\`

## Flow

\`\`\`mermaid
graph LR
  A[Given u, θ] --> B[Split into u cosθ, u sinθ]
  B --> C[Time of flight]
  C --> D[Range & height]
\`\`\`

---

*Press* <kbd>A+</kbd> / <kbd>A−</kbd> *to resize text, and switch theme from the top bar.* ==Highlighted text== works too.
`;
$('#demoBtn').onclick = () => render(SAMPLE, 'sample.md');

/* in-page links: scroll instead of navigating (a <base> tag may point elsewhere) */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const t = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
  if (t) { e.preventDefault(); t.scrollIntoView({behavior:'smooth'}); }
});

/* ---------- search in document ---------- */
let hits = [], hitI = -1, findTm = null;
function clearFind(){
  document.querySelectorAll('#doc mark.hit').forEach(m => { const p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize(); });
  hits = []; hitI = -1;
}
function runFind(q, keepPlace){
  const prev = hitI;
  clearFind();
  if (!q) { $('#findN').textContent = ''; return; }
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const walker = document.createTreeWalker($('#doc'), NodeFilter.SHOW_TEXT, { acceptNode(n){
    const p = n.parentElement;
    if (!n.nodeValue.trim() || !p || p.closest('mjx-container, svg, script, style, .anchor, .lang, .copy')) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT; } });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const t = n.nodeValue; re.lastIndex = 0; let m, last = 0, frag = null;
    while ((m = re.exec(t))) {
      frag = frag || document.createDocumentFragment();
      frag.append(t.slice(last, m.index));
      const mk = document.createElement('mark'); mk.className = 'hit'; mk.textContent = m[0];
      frag.append(mk); hits.push(mk); last = m.index + m[0].length;
    }
    if (frag) { frag.append(t.slice(last)); n.parentNode.replaceChild(frag, n); }
  }
  if (!hits.length) { $('#findN').textContent = '0/0'; return; }
  if (keepPlace && prev >= 0) gotoHit(Math.min(prev, hits.length - 1), false);
  else { const i = hits.findIndex(h => h.getBoundingClientRect().top > 70); gotoHit(i < 0 ? 0 : i); }
}
function gotoHit(i, scroll = true){
  if (!hits.length) return;
  if (hits[hitI]) hits[hitI].classList.remove('cur');
  hitI = (i + hits.length) % hits.length;
  const h = hits[hitI]; h.classList.add('cur');
  const d = h.closest('details'); if (d) d.open = true;
  if (scroll) h.scrollIntoView({ block: 'center' });
  $('#findN').textContent = `${hitI + 1}/${hits.length}`;
}
function openFind(){ if ($('#doc').hidden) return; $('#find').hidden = false; $('#findQ').focus(); $('#findQ').select(); if ($('#findQ').value) runFind($('#findQ').value); }
function closeFind(){ $('#find').hidden = true; clearFind(); $('#findN').textContent = ''; }
$('#findBtn').onclick = () => $('#find').hidden ? openFind() : closeFind();
$('#findQ').addEventListener('input', e => { clearTimeout(findTm); findTm = setTimeout(() => runFind(e.target.value), 150); });
$('#findQ').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); if (!hits.length) runFind(e.target.value); else gotoHit(hitI + (e.shiftKey ? -1 : 1)); }
  if (e.key === 'Escape') closeFind();
});
$('#findPrev').onclick = () => gotoHit(hitI - 1);
$('#findNext').onclick = () => gotoHit(hitI + 1);
$('#findX').onclick = closeFind;
addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && M && M.tok) { e.preventDefault(); if (editing) save(); return; }
  if (editing) return;                                   // in the editor the browser's own Ctrl+F works
  if (e.key.toLowerCase() === 'e' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey && M && M.tok) { e.preventDefault(); startEdit(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { if (!$('#doc').hidden) { e.preventDefault(); openFind(); } }
  else if (e.key === '/' && !typing) { e.preventDefault(); openFind(); }
  else if (e.key === 'Escape' && !$('#find').hidden) closeFind();
});

/* ---------- show in folder: mdreader:// link handled by mdview (opens the file manager) ---------- */
if (window.__MD && window.__MD.path) {
  const r = $('#revealBtn');
  r.href = 'mdreader://reveal?path=' + encodeURIComponent(window.__MD.path);
  r.title = 'Show in folder: ' + window.__MD.dir;
  r.hidden = false;
}

/* ---------- live reload: the mdview watcher rewrites a small .live.js when the file is saved ---------- */
let curMtime = window.__MD ? window.__MD.mtime : null;
if (window.__MD && window.__MD.live) {
  window.__mdLive = (mt, text) => {
    if (!mt || mt === curMtime || text == null) return;
    curMtime = mt; window.__MD.text = text;
    if (editing) { liveWhileEditing(mt, text); return; }
    render(text, window.__MD.name, { live: true });
    const l = $('#live'); l.classList.add('flash'); l.textContent = '● Updated'; setTimeout(() => { l.classList.remove('flash'); l.textContent = '● Live'; }, 1500);
  };
  $('#live').hidden = false;
  setInterval(() => {
    if (document.hidden) return;
    const s = document.createElement('script');
    s.src = window.__MD.live + '?' + Date.now();
    s.onload = s.onerror = () => s.remove();
    document.head.appendChild(s);
  }, 1000);
}

/* ---------- edit: text on the left, preview on the right; Save goes to the mdview helper on 127.0.0.1 ---------- */
let editing = false, dirty = false, saving = false, editBase = null, pvTm = null;
const ed = $('#ed');
function setState(t, k){ const s = $('#edState'); s.textContent = t; s.title = t; s.dataset.k = k || ''; }
function startEdit(){
  if (!M || !M.tok || editing) return;
  closeFind(); savePos();
  editing = true; dirty = false; editBase = curMtime;
  ed.value = M.text;
  document.body.classList.add('editing'); document.body.classList.remove('pv');
  setState('No changes');
  render(ed.value, M.name, { live: true });
  ed.focus(); ed.setSelectionRange(0, 0); ed.scrollTop = 0;
}
function stopEdit(){
  if (dirty && !confirm('Discard the unsaved changes?')) return;
  editing = false; dirty = false;
  document.body.classList.remove('editing', 'pv');
  render(M.text, M.name);
}
function liveWhileEditing(mt, text){
  if (text === ed.value) { editBase = mt; if (dirty) { dirty = false; setState('Saved', 'ok'); } return; }
  if (!dirty) { ed.value = text; editBase = mt; render(text, M.name, { live: true }); setState('Reloaded: the file changed on disk', 'ok'); return; }
  setState('The file changed on disk. Save will ask before overwriting.', 'err');
}
ed.addEventListener('input', () => {
  if (!dirty) { dirty = true; setState('Unsaved changes', 'dirty'); }
  clearTimeout(pvTm); pvTm = setTimeout(() => render(ed.value, M.name, { live: true }), 300);
});
ed.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || e.ctrlKey || e.altKey || e.metaKey) return;
  e.preventDefault();
  if (!document.execCommand('insertText', false, '  ')) { ed.setRangeText('  ', ed.selectionStart, ed.selectionEnd, 'end'); ed.dispatchEvent(new Event('input')); }
});
function findServer(){
  return new Promise((res, rej) => {
    window.__mdSrv = p => res(p);
    const s = document.createElement('script');
    s.src = M.srv + '?' + Date.now();
    s.onload = () => { s.remove(); setTimeout(() => rej(new Error('nohelper')), 30); };
    s.onerror = () => { s.remove(); rej(new Error('nohelper')); };
    document.head.appendChild(s);
  });
}
async function save(force){
  if (!editing || saving) return;
  const text = ed.value;
  saving = true; setState('Saving…');
  try {
    const port = await findServer();
    let r;
    try {
      r = await fetch(`http://127.0.0.1:${port}/save`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: M.path, tok: M.tok, base: force ? null : editBase, text }) });
    } catch { throw new Error('nohelper'); }
    const j = await r.json().catch(() => ({}));
    if (r.status === 409) {
      saving = false;
      if (confirm('This file was changed outside the reader after you started editing.\n\nOK: overwrite it with your text (the old version is kept in ~/mdreader/backups)\nCancel: keep editing, nothing is saved')) return save(true);
      setState('Not saved: the file changed on disk', 'err'); return;
    }
    if (!r.ok || !j.ok) throw new Error(j.error || 'HTTP ' + r.status);
    M.text = text; curMtime = editBase = j.mtime;
    if (ed.value === text) { dirty = false; setState('Saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), 'ok'); }
    else setState('Unsaved changes', 'dirty');
  } catch (e) {
    setState(e.message === 'nohelper' ? 'Not saved: the save helper is not running. Open the file with mdview again, then Save.' : 'Not saved: ' + e.message, 'err');
  } finally { saving = false; }
}
$('#editBtn').onclick = startEdit;
$('#doneBtn').onclick = stopEdit;
$('#saveBtn').onclick = () => save();
$('#pvBtn').onclick = () => { const on = document.body.classList.toggle('pv'); $('#pvBtn').textContent = on ? 'Text' : 'Preview'; if (!on) ed.focus(); };
addEventListener('beforeunload', e => { if (editing && dirty) { e.preventDefault(); e.returnValue = ''; } });
if (M && M.tok && M.srv) $('#editBtn').hidden = false;

/* opened by the mdview launcher: file content is embedded in window.__MD */
if (window.__MD) {
  const go = () => render(window.__MD.text, window.__MD.name);
  if (window.MathJax && MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(go, go); else go();
}
</script>
